// App-owned build adapter; upstream source, build files and MIT license stay intact.
plugins {
    id 'org.jetbrains.kotlin.jvm'
}

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_11
    }
    sourceSets.main.kotlin.srcDirs = [file('../astronomy/source/kotlin/src/main/kotlin')]
}
